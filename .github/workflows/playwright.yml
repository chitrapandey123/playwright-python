name: Playwright Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to test'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Download previous Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Run tests
        id: run_tests
        env:
          ENV: ${{ github.event.inputs.env || 'prod' }}
        run: |
          mkdir -p allure-results
          pytest -v --tb=short
        continue-on-error: true

      - name: Set report path
        if: always()
        run: |
          BRANCH=$(echo "${GITHUB_REF_NAME}" | sed 's|/|-|g')
          echo "BRANCH_SAFE=${BRANCH}" >> $GITHUB_ENV
          echo "REPORT_DIR=reports/${BRANCH}/${{ github.run_number }}" >> $GITHUB_ENV

      - name: Copy Allure history
        if: always()
        run: |
          mkdir -p allure-results/history
          HISTORY_DIR="gh-pages/reports/${BRANCH_SAFE}/history"
          if [ -d "${HISTORY_DIR}" ]; then
            cp -r "${HISTORY_DIR}/." allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure-2.27.0.tgz
          ./allure-2.27.0/bin/allure generate allure-results -o allure-report --clean

      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ env.BRANCH_SAFE }}-${{ github.run_number }}
          path: allure-report/
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: ${{ env.REPORT_DIR }}
          keep_files: true

      - name: Update branch history for next run
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report/history
          destination_dir: reports/${{ env.BRANCH_SAFE }}/history
          keep_files: false
          force_orphan: false

      - name: Deploy latest report to allure-history
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure-history
          keep_files: false

      - name: Print report URL
        if: always()
        run: |
          REPORT_URL="https://chitrapandey123.github.io/playwright-python/${REPORT_DIR}/"
          echo "Allure report: ${REPORT_URL}"
          echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "[View Report](${REPORT_URL})" >> $GITHUB_STEP_SUMMARY

      - name: Run auto-fix agent
        if: steps.run_tests.outcome == 'failure' && !startsWith(github.ref, 'refs/heads/auto-fix/')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "auto-fix-agent[bot]"
          git config user.email "auto-fix-agent@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git
          python auto_fix_agent.py 2>&1

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Tests failed — see Allure report for details."
          exit 1
